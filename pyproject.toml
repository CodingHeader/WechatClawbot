[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-clawbot"
version = "0.1.0"
description = "多用户微信 ClawBot：扫码绑定、长轮询收消息、AI 问答、主动通知"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "apscheduler>=3.10.4",
    "litellm>=1.50.0",
    "qrcode[pil]>=7.4.2",
    "python-dotenv>=1.0.1",
    "mcp>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "respx>=0.21.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
wechat-clawbot = "wechat_clawbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
